name: CI

# Pull requests to main only. The jobs: build, the lid simulation gate and
# the fast unit tests; the end-to-end smoke test of the real app; and
# ShellCheck over scripts/.
# The full suite (`swift test`) runs by hand before a release.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Build and fast tests
    runs-on: macos-26
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: swift build -c release -Xswiftc -warnings-as-errors
      - name: Lid simulation stays out of release builds
        # The release build above must lack the simulate-lid.sh watcher and
        # the smoke test's control channel, and a build with
        # -DINSOMNIA_LID_SIMULATION (what build-app.sh adds for
        # INSOMNIA_LID_SIMULATION=1) must have them.
        run: scripts/check-lid-simulation-gate.sh
      - name: Fast tests
        run: scripts/test-fast.sh
        env:
          NSUnbufferedIO: "YES"

  smoke:
    name: End-to-end smoke test
    # Builds the test build of Ember.app and runs scripts/smoke-test.sh: the
    # real app, launched in test mode in a throwaway EMBER_HOME, driven
    # through its test-only control channel, with the real IOPM assertion
    # checked in `pmset -g assertions`. Test mode needs no root, no password
    # and no launchctl (TestMode.swift), so it runs on a hosted runner as is.
    runs-on: macos-26
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Print macOS and toolchain versions
        run: |
          sw_vers
          swift --version
      - name: Run the smoke test
        run: scripts/smoke-test.sh

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck
        run: shellcheck --shell=bash scripts/*.sh
