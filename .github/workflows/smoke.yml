name: Smoke test

# Builds the test build of Awake.app and runs scripts/smoke-test.sh: the
# real app, launched in test mode in a throwaway AWAKE_HOME, driven through
# its test-only control channel, with the real IOPM assertion checked in
# `pmset -g assertions`. Test mode needs no root, no password and no
# launchctl (TestMode.swift), so it runs on a hosted runner as is.

on:
  pull_request:
    branches: [main]
    # ready_for_review on top of the default three, as in ci.yml:
    # `merge-gate.sh rerun` marks a pull request draft and then ready.
    types: [opened, synchronize, reopened, ready_for_review]

# Nothing at the top level; the job declares what it needs.
permissions: {}

# A newer push to the same pull request cancels the stale run.
concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: End-to-end smoke test (macOS 26)
    runs-on: macos-26
    # The release build of the test build takes most of it; the eight
    # steps take under a minute.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Print macOS and toolchain versions
        run: |
          sw_vers
          swift --version

      - name: Run the smoke test
        run: scripts/smoke-test.sh
